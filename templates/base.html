<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Valmetrics{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
            },
            borderRadius: {
              DEFAULT: '0.75rem',  // bumps every `rounded` from 4px to 12px
              md: '0.625rem',
            },
            boxShadow: {
              card: '0 1px 2px 0 rgb(0 0 0 / 0.04), 0 1px 3px 0 rgb(0 0 0 / 0.06)',
              lift: '0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05)',
            },
          },
        },
      };
    </script>
    <style>
      body { font-feature-settings: "cv02", "cv03", "cv04", "cv11"; }
      [x-cloak] { display: none !important; }
    </style>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<body class="bg-slate-50 text-gray-900 antialiased">
    <nav class="bg-white/80 backdrop-blur border-b border-gray-200/70 sticky top-0 z-40">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <div class="flex items-center gap-6">
                <a href="/" class="text-lg font-semibold tracking-tight text-gray-900">
                    <span class="inline-flex items-center gap-2">
                        <span class="inline-block w-6 h-6 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600"></span>
                        Valmetrics
                    </span>
                </a>
                <div class="flex items-center gap-1 text-sm">
                    <a href="/" class="px-3 py-1.5 rounded-full text-gray-700 hover:bg-gray-100 transition">Home</a>
                    <a href="/watchlist/" class="px-3 py-1.5 rounded-full text-gray-700 hover:bg-gray-100 transition">Watchlist</a>
                </div>
            </div>
            <form action="/search/" method="get" class="flex items-center gap-2"
                  x-data="{ open: false }">
                <div class="relative">
                    <input
                        type="text"
                        name="q"
                        placeholder="Search ticker or company..."
                        autocomplete="off"
                        hx-get="/search/"
                        hx-trigger="input changed delay:300ms, focus"
                        hx-target="#search-suggest"
                        hx-swap="innerHTML"
                        @focus="open = true"
                        @blur.debounce.200ms="open = false"
                        @keydown.escape="open = false; $event.target.blur()"
                        class="pl-4 pr-4 py-2 text-sm border border-gray-200 rounded-full w-72 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400 transition"
                    />
                    <div id="search-suggest"
                         x-show="open"
                         x-cloak
                         x-transition.opacity
                         class="absolute top-full left-0 right-0 mt-2 z-50"
                         @click="open = false"></div>
                </div>
                <button type="submit" class="px-4 py-2 text-sm font-medium bg-blue-600 text-white rounded-full hover:bg-blue-700 shadow-sm hover:shadow transition">
                    Search
                </button>
            </form>
        </div>
    </nav>

    <main class="container mx-auto p-4">
        {% block content %}{% endblock %}
    </main>
    <script>
        document.body.addEventListener('htmx:configRequest', function(evt) {
            var token = document.querySelector('meta[name="csrf-token"]');
            if (token) {
                evt.detail.headers['X-CSRFToken'] = token.content;
            }
        });
    </script>
</body>
</html>
