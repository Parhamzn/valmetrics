{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Valmetrics{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    {# User preferences (theme + timezone), applied before Tailwind paints to avoid a FOUC. #}
    <script>
      (function() {
        var stored = {};
        try { stored = JSON.parse(localStorage.getItem('valmetrics_prefs') || '{}'); } catch(e) {}
        var prefs = {
          theme: stored.theme || 'system',     // 'light' | 'dark' | 'system'
          timezone: stored.timezone || 'local', // 'local' or IANA name
          save: function() {
            try {
              localStorage.setItem('valmetrics_prefs', JSON.stringify({
                theme: this.theme, timezone: this.timezone
              }));
            } catch(e) {}
          },
          applyTheme: function() {
            var t = this.theme;
            var dark = t === 'dark' ||
              (t === 'system' && window.matchMedia &&
               window.matchMedia('(prefers-color-scheme: dark)').matches);
            var html = document.documentElement;
            // Suppress all CSS transitions for the duration of the toggle so
            // colors flip in one paint instead of slowly fading.
            html.classList.add('theme-changing');
            html.classList.toggle('dark', dark);
            html.dataset.theme = dark ? 'dark' : 'light';
            // Force a reflow so the class change is applied before we lift
            // the no-transition guard.
            void html.offsetHeight;
            requestAnimationFrame(function() {
              html.classList.remove('theme-changing');
            });
          },
          getTimezone: function() {
            if (!this.timezone || this.timezone === 'local') {
              try { return Intl.DateTimeFormat().resolvedOptions().timeZone; }
              catch(e) { return 'UTC'; }
            }
            return this.timezone;
          },
        };
        window.userPrefs = prefs;
        prefs.applyTheme();
        if (window.matchMedia) {
          var mq = window.matchMedia('(prefers-color-scheme: dark)');
          var listener = function() { if (prefs.theme === 'system') prefs.applyTheme(); };
          if (mq.addEventListener) mq.addEventListener('change', listener);
          else if (mq.addListener) mq.addListener(listener);
        }
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
            },
            borderRadius: {
              DEFAULT: '0.75rem',  // bumps every `rounded` from 4px to 12px
              md: '0.625rem',
            },
            boxShadow: {
              card: '0 1px 2px 0 rgb(0 0 0 / 0.04), 0 1px 3px 0 rgb(0 0 0 / 0.06)',
              lift: '0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05)',
            },
          },
        },
      };
    </script>
    <style>
      body { font-feature-settings: "cv02", "cv03", "cv04", "cv11"; }
      [x-cloak] { display: none !important; }
      /* Snap-to-theme: while .theme-changing is set on <html>, ALL element
         transitions are suppressed so the dark mode swap is instant.
         Removed on the next animation frame so hover/focus transitions
         keep working normally afterwards. */
      .theme-changing, .theme-changing *, .theme-changing *::before, .theme-changing *::after {
        transition: none !important;
      }
      /* In dark mode, text inside tinted info/warning/error callouts
         (blue/yellow/red/green 950) is white. Tailwind's default text
         tone for these elements (e.g. text-blue-900) is too dark to read
         against the 950 bg, and dark:text-X-300 is still too low contrast. */
      .dark .dark\:bg-blue-950\/40,
      .dark .dark\:bg-yellow-950\/40,
      .dark .dark\:bg-red-950\/40,
      .dark .dark\:bg-green-950\/40 {
        color: rgb(255 255 255) !important;
      }
      /* Keep links inside callouts visibly link-colored (overrides the
         white-text inheritance above). */
      .dark .dark\:bg-blue-950\/40 a,
      .dark .dark\:bg-yellow-950\/40 a,
      .dark .dark\:bg-red-950\/40 a,
      .dark .dark\:bg-green-950\/40 a {
        color: rgb(147 197 253);  /* blue-300 */
      }
      /* Default styling for form controls in dark mode.
         Avoids having to add dark: variants to every <input>/<select>/<textarea>
         in every model assumption form. Specific classes can still override. */
      .dark input[type="number"],
      .dark input[type="text"],
      .dark input[type="search"],
      .dark input[type="email"],
      .dark input:not([type]),
      .dark select,
      .dark textarea {
        background-color: rgb(30 41 59);   /* slate-800 */
        color: rgb(243 244 246);            /* gray-100 */
        border-color: rgb(51 65 85);        /* slate-700 */
      }
      .dark input::placeholder, .dark textarea::placeholder { color: rgb(100 116 139); }
      /* Native autofill background in dark mode */
      .dark input:-webkit-autofill { -webkit-text-fill-color: rgb(243 244 246); -webkit-box-shadow: 0 0 0 30px rgb(30 41 59) inset; }
    </style>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-gray-900 dark:text-gray-100 antialiased">
    <nav class="bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-gray-200/70 dark:border-slate-800/70 sticky top-0 z-40">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <div class="flex items-baseline gap-6">
                <a href="/" class="text-lg font-semibold tracking-tight text-gray-900 dark:text-gray-50">
                    <span class="inline-flex items-baseline gap-2">
                        <picture>
                            <source srcset="{% static 'img/logo.webp' %}" type="image/webp">
                            <img src="{% static 'img/logo.png' %}"
                                 alt="Valmetrics"
                                 class="w-10 h-10 rounded-full self-end"
                                 width="40" height="40" />
                        </picture>
                        Valmetrics
                    </span>
                </a>
                <div class="flex items-baseline gap-1 text-sm">
                    <a href="/" class="px-3 py-1.5 rounded-full text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-800 transition">Home</a>
                    <a href="/watchlist/" class="px-3 py-1.5 rounded-full text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-800 transition">Watchlist</a>
                    <a href="/settings/" class="px-3 py-1.5 rounded-full text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-800 transition">Settings</a>
                </div>
            </div>
            <form action="/search/" method="get" class="flex items-center gap-2"
                  x-data="{ open: false }">
                <div class="relative">
                    <input
                        type="text"
                        name="q"
                        placeholder="Search ticker or company..."
                        autocomplete="off"
                        hx-get="/search/"
                        hx-trigger="input changed delay:300ms, focus"
                        hx-target="#search-suggest"
                        hx-swap="innerHTML"
                        @focus="open = true"
                        @blur.debounce.200ms="open = false"
                        @keydown.escape="open = false; $event.target.blur()"
                        class="pl-4 pr-4 py-2 text-sm border border-gray-200 dark:border-slate-700 rounded-full w-72 bg-gray-50 dark:bg-slate-800 dark:text-gray-100 dark:placeholder-gray-500 focus:bg-white dark:focus:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400 transition"
                    />
                    <div id="search-suggest"
                         x-show="open"
                         x-cloak
                         x-transition.opacity
                         class="absolute top-full left-0 right-0 mt-2 z-50"
                         @click="open = false"></div>
                </div>
                <button type="submit" class="px-4 py-2 text-sm font-medium bg-blue-600 text-white rounded-full hover:bg-blue-700 shadow-sm hover:shadow transition">
                    Search
                </button>
            </form>
        </div>
    </nav>

    <main class="container mx-auto p-4">
        {% block content %}{% endblock %}
    </main>
    <script>
        document.body.addEventListener('htmx:configRequest', function(evt) {
            var token = document.querySelector('meta[name="csrf-token"]');
            if (token) {
                evt.detail.headers['X-CSRFToken'] = token.content;
            }
        });

        // Format a big number as $1.23T / $456.78B / $9.87M / $1.23K
        window.fmtBigMoney = function(n) {
            if (n === null || n === undefined || isNaN(n)) return '—';
            var sign = n < 0 ? '-' : '';
            var a = Math.abs(n);
            if (a >= 1e12) return sign + '$' + (a/1e12).toFixed(2) + 'T';
            if (a >= 1e9)  return sign + '$' + (a/1e9 ).toFixed(2) + 'B';
            if (a >= 1e6)  return sign + '$' + (a/1e6 ).toFixed(2) + 'M';
            if (a >= 1e3)  return sign + '$' + (a/1e3 ).toFixed(2) + 'K';
            return sign + '$' + a.toFixed(2);
        };

        // Compact non-currency big number for volume (153.5M, 1.2B, etc.)
        window.fmtCompact = function(n) {
            if (n === null || n === undefined || isNaN(n) || n === 0) return '—';
            var a = Math.abs(n);
            if (a >= 1e12) return (n/1e12).toFixed(2) + 'T';
            if (a >= 1e9)  return (n/1e9 ).toFixed(2) + 'B';
            if (a >= 1e6)  return (n/1e6 ).toFixed(2) + 'M';
            if (a >= 1e3)  return (n/1e3 ).toFixed(2) + 'K';
            return n.toFixed(0);
        };

        // Format an ISO timestamp for the user's local timezone (or
        // window.userPrefs override) using a format that depends on the
        // chart's period. Used by the price chart for axis ticks AND
        // tooltips, so labels match.
        window.fmtPriceTime = function(iso, period) {
            if (!iso) return '';
            var d = new Date(iso);
            if (isNaN(d.getTime())) return iso;
            var tz = (window.userPrefs && window.userPrefs.getTimezone()) || undefined;
            var opts;
            switch (period) {
                case '1d':
                    opts = { hour: 'numeric', minute: '2-digit', timeZone: tz };
                    break;
                case '1w':
                    opts = { month: 'short', day: 'numeric', hour: 'numeric', timeZone: tz };
                    break;
                case '1mo':
                    opts = { month: 'short', day: 'numeric', timeZone: tz };
                    break;
                case '1y':
                    opts = { month: 'short', year: '2-digit', timeZone: tz };
                    break;
                case 'max':
                    opts = { year: 'numeric', timeZone: tz };
                    break;
                default:
                    opts = { month: 'short', day: 'numeric', year: 'numeric', timeZone: tz };
            }
            try { return new Intl.DateTimeFormat(undefined, opts).format(d); }
            catch (e) { return iso; }
        };

        // Format an ISO timestamp as a friendly tooltip title — always shows
        // both date and (for short periods) time, in user's tz.
        window.fmtPriceTooltipTitle = function(iso, period) {
            if (!iso) return '';
            var d = new Date(iso);
            if (isNaN(d.getTime())) return iso;
            var tz = (window.userPrefs && window.userPrefs.getTimezone()) || undefined;
            var opts = (period === '1d' || period === '1w')
                ? { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: tz }
                : { month: 'short', day: 'numeric', year: 'numeric', timeZone: tz };
            try { return new Intl.DateTimeFormat(undefined, opts).format(d); }
            catch (e) { return iso; }
        };

        // Theme-aware colors for Chart.js (re-read at chart init time;
        // requires a page refresh to switch themes mid-session).
        window.chartThemeColors = function() {
            var dark = document.documentElement.classList.contains('dark');
            return {
                tickColor: dark ? '#94a3b8' : '#9ca3af',
                gridColor: dark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.05)',
                tooltipBg: dark ? 'rgba(15, 23, 42, 0.98)' : 'rgba(17, 24, 39, 0.95)',
                tooltipTitleColor: dark ? '#f1f5f9' : '#ffffff',
                tooltipBodyColor: dark ? '#e2e8f0' : '#ffffff',
                cardBg: dark ? '#0f172a' : '#ffffff',
            };
        };

        // Clip plugin: hides the outer half of the first and last volume
        // bars so the chart's left & right edges look balanced. Achieved
        // by clipping the bar dataset's draw area to [first.x, last.x] —
        // the line dataset is unclipped so the area fill still extends
        // edge-to-edge.
        var halfEdgesPlugin = {
            id: 'halfEdges',
            beforeDatasetDraw: function(chart, args) {
                if (!args.meta || args.meta.type !== 'bar') return;
                var data = args.meta.data;
                if (!data || data.length < 2) return;
                var ctx = chart.ctx;
                ctx.save();
                ctx.beginPath();
                ctx.rect(data[0].x, 0, data[data.length - 1].x - data[0].x, chart.height);
                ctx.clip();
            },
            afterDatasetDraw: function(chart, args) {
                if (!args.meta || args.meta.type !== 'bar') return;
                chart.ctx.restore();
            },
        };

        // X.com-style price chart: smooth area line on top, muted volume
        // bars hugging the bottom, no visible axes/grids. Color (green/red)
        // is decided by whether the period ended up or down.
        // data = { labels, values, volumes, label, currency, up, period }
        window.initPriceChart = function(canvas, data) {
            if (!canvas || !window.Chart) return;
            if (!data || !data.labels || data.labels.length === 0) return;
            var existing = Chart.getChart(canvas);
            if (existing) existing.destroy();
            var period = data.period || '1y';
            var up = !!data.up;
            var line = up ? 'rgba(22, 163, 74, 1)'    : 'rgba(220, 38, 38, 1)';
            var fill = up ? 'rgba(22, 163, 74, 0.15)' : 'rgba(220, 38, 38, 0.12)';
            var n = data.values.length;
            var pointRadii = new Array(n).fill(0);
            var pointBg    = new Array(n).fill('transparent');
            pointRadii[n - 1] = 5;
            pointBg[n - 1]    = line;
            var maxVol = 0;
            if (data.volumes) {
                for (var i = 0; i < data.volumes.length; i++) {
                    if (data.volumes[i] > maxVol) maxVol = data.volumes[i];
                }
            }
            var volMax = (maxVol > 0 ? maxVol : 1) * 5;
            var hasVolume = data.volumes && data.volumes.some(function(v){return v>0;});
            var theme = window.chartThemeColors();

            // Optional cursor hook: when the user hovers over the chart,
            // call window._priceChartCursor with the data index (or null on
            // leave). Used by the overview tab to animate the big readout.
            canvas.addEventListener('mouseleave', function() {
                if (window._priceChartCursor) window._priceChartCursor(null);
            });

            new Chart(canvas, {
                plugins: [halfEdgesPlugin],
                data: {
                    labels: data.labels,
                    datasets: [
                        {
                            type: 'line',
                            data: data.values,
                            yAxisID: 'price',
                            borderColor: line,
                            backgroundColor: fill,
                            fill: true,
                            borderWidth: 2,
                            pointRadius: pointRadii,
                            pointBackgroundColor: pointBg,
                            pointBorderColor: pointBg,
                            pointHoverRadius: 5,
                            pointHoverBorderWidth: 2,
                            pointHoverBackgroundColor: '#fff',
                            pointHoverBorderColor: line,
                            tension: 0.35,
                            order: 1,
                        },
                        hasVolume ? {
                            type: 'bar',
                            data: data.volumes,
                            yAxisID: 'volume',
                            backgroundColor: 'rgba(156, 163, 175, 0.45)',
                            borderWidth: 0,
                            borderRadius: 0,
                            categoryPercentage: 1.0,
                            barPercentage: 0.92,
                            order: 2,
                        } : null,
                    ].filter(Boolean),
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { intersect: false, mode: 'index' },
                    onHover: function(_e, active) {
                        if (!window._priceChartCursor) return;
                        window._priceChartCursor(active.length > 0 ? active[0].index : null);
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: theme.tooltipBg,
                            titleColor: theme.tooltipTitleColor,
                            bodyColor: theme.tooltipBodyColor,
                            padding: 10,
                            cornerRadius: 8,
                            displayColors: false,
                            titleFont: { family: 'Inter', size: 12, weight: '600' },
                            bodyFont: { family: 'JetBrains Mono', size: 12 },
                            callbacks: {
                                title: function(items) {
                                    if (!items || !items.length) return '';
                                    return window.fmtPriceTooltipTitle(data.labels[items[0].dataIndex], period);
                                },
                                label: function(ctx) {
                                    if (ctx.datasetIndex === 0) {
                                        return 'Price   ' + (data.currency ? data.currency + ' ' : '$') + ctx.parsed.y.toFixed(2);
                                    }
                                    return 'Volume  ' + window.fmtCompact(ctx.parsed.y);
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            display: true,
                            grid: { display: false },
                            border: { display: false },
                            ticks: {
                                autoSkip: true,
                                maxTicksLimit: 6,
                                maxRotation: 0,
                                font: { family: 'Inter', size: 11 },
                                color: theme.tickColor,
                                callback: function(_value, idx) {
                                    return window.fmtPriceTime(data.labels[idx], period);
                                }
                            }
                        },
                        price:  {
                            type: 'linear',
                            position: 'right',
                            display: false,
                            grid: { display: false },
                        },
                        volume: {
                            type: 'linear',
                            position: 'left',
                            display: false,
                            grid: { display: false },
                            min: 0,
                            max: volMax,
                        }
                    },
                    layout: { padding: { top: 4, right: 0, bottom: 0, left: 0 } }
                }
            });
        };

        // Initialize a bar chart for a statement line item.
        // data = { labels: [...], values: [...], label: 'Total revenue' }
        window.initStatementChart = function(canvas, data) {
            if (!canvas || !window.Chart) return;
            if (!data || !data.labels || data.labels.length === 0) {
                var ctx0 = canvas.getContext('2d');
                ctx0.fillStyle = '#9ca3af';
                ctx0.font = '12px Inter, sans-serif';
                ctx0.textAlign = 'center';
                ctx0.fillText('No data points available', canvas.width / 2, 30);
                return;
            }
            // Destroy any existing chart on this canvas (re-renders are safe)
            var existing = Chart.getChart(canvas);
            if (existing) existing.destroy();
            var theme = window.chartThemeColors();
            new Chart(canvas, {
                type: 'bar',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: data.label || '',
                        data: data.values,
                        backgroundColor: data.values.map(function(v) {
                            return v < 0 ? 'rgba(220, 38, 38, 0.8)' : 'rgba(37, 99, 235, 0.85)';
                        }),
                        borderRadius: 6,
                        borderSkipped: false,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: theme.tooltipBg,
                            titleColor: theme.tooltipTitleColor,
                            bodyColor: theme.tooltipBodyColor,
                            padding: 10,
                            cornerRadius: 8,
                            titleFont: { family: 'Inter', size: 12 },
                            bodyFont: { family: 'JetBrains Mono', size: 12 },
                            callbacks: {
                                label: function(ctx) { return window.fmtBigMoney(ctx.parsed.y); }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { font: { family: 'Inter', size: 11 }, color: theme.tickColor }
                        },
                        y: {
                            grid: { color: theme.gridColor },
                            ticks: {
                                font: { family: 'JetBrains Mono', size: 11 },
                                color: theme.tickColor,
                                callback: function(v) { return window.fmtBigMoney(v); }
                            }
                        }
                    }
                }
            });
        };
    </script>
</body>
</html>
