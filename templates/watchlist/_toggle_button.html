{% if is_watched %}
<button type="button"
        hx-post="{% url 'watchlist:remove' %}?ticker={{ ticker }}"
        hx-target="this"
        hx-swap="outerHTML"
        class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-medium bg-white border border-red-200 text-red-700 rounded-full hover:bg-red-50 hover:border-red-300 shadow-sm hover:shadow transition">
    <span class="text-base leading-none">−</span> Watching
</button>
{% else %}
<button type="button"
        hx-post="{% url 'watchlist:add' %}?ticker={{ ticker }}"
        hx-target="this"
        hx-swap="outerHTML"
        class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-medium bg-blue-600 text-white border border-blue-600 rounded-full hover:bg-blue-700 shadow-sm hover:shadow transition">
    <span class="text-base leading-none">+</span> Add to watchlist
</button>
{% endif %}
